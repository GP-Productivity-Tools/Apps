<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SITE_NAME__</title>
<meta name="description" content="Small tools and apps for general practice teams, clinicians and volunteers.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f766e'/><path d='M30 50h40M50 30v40' stroke='white' stroke-width='12' stroke-linecap='round'/></svg>">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1c1d1f; --muted: #5f6368;
    --line: #e4e4e0; --accent: #0f766e; --accent-soft: #e6f2f0; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141516; --card: #1e1f21; --ink: #eceae6; --muted: #a3a6aa;
            --line: #2e3033; --accent: #4fb8ac; --accent-soft: #1d3330; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  header { padding: 56px 0 28px; }
  .mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; color: var(--accent);
          letter-spacing: .02em; font-size: 14px; text-transform: uppercase; }
  .mark span { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-block; }
  h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.12; margin: 14px 0 10px; letter-spacing: -.02em; max-width: 820px; }
  .lede { color: var(--muted); max-width: 640px; margin: 0; font-size: 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 28px 0 18px; }
  .search { flex: 1 1 240px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
            background: var(--card); color: var(--ink); font: inherit; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
          padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding-bottom: 56px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;
          display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit;
          transition: transform .15s ease, border-color .15s ease; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); }
  .card-top { display: flex; align-items: center; gap: 12px; }
  .icon { width: 42px; height: 42px; border-radius: 11px; background: var(--accent-soft);
          display: grid; place-items: center; font-size: 22px; flex: none; }
  .card h2 { font-size: 17px; margin: 0; line-height: 1.3; }
  .tag { font-size: 12px; color: var(--muted); }
  .card p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
  .open { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
          background: var(--accent-soft); color: var(--accent); }
  .empty { color: var(--muted); padding: 10px 0 56px; display: none; }
  footer { border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--muted); font-size: 14px; }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><span aria-hidden="true"></span><b id="site-name"></b></div>
    <h1 id="headline"></h1>
    <p class="lede" id="intro"></p>
  </header>
  <div class="controls" role="search">
    <input class="search" id="q" type="search" placeholder="Search apps…" aria-label="Search apps">
    <div class="chips" id="chips"></div>
  </div>
  <main class="grid" id="grid" aria-live="polite"></main>
  <p class="empty" id="empty">No apps match that search.</p>
  <footer>
    <p id="footer"></p>
    <p id="disclaimer"></p>
    <p>Updated __BUILT__.</p>
  </footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const { site, apps } = DATA;
const $ = id => document.getElementById(id);
$("site-name").textContent = site.name;
$("headline").textContent = site.headline;
$("intro").textContent = site.intro;
$("footer").textContent = site.footer;
$("disclaimer").textContent = site.disclaimer;

let active = "All";
const cats = ["All", ...new Set(apps.map(a => a.category))];
if (cats.length > 2) cats.forEach(c => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = c;
  b.setAttribute("aria-pressed", c === active);
  b.onclick = () => { active = c; [...$("chips").children].forEach(x => x.setAttribute("aria-pressed", x === b)); render(); };
  $("chips").appendChild(b);
});

function card(a) {
  const el = document.createElement("a");
  el.className = "card"; el.href = a.url;
  el.innerHTML = '<div class="card-top"><div class="icon" aria-hidden="true"></div><div><h2></h2><div class="tag"></div></div></div><p></p><span class="open">Open app →</span>';
  el.querySelector(".icon").textContent = a.icon;
  el.querySelector("h2").textContent = a.title;
  el.querySelector(".tag").textContent = a.category;
  el.querySelector("p").textContent = a.description;
  return el;
}
function render() {
  const t = $("q").value.trim().toLowerCase();
  const list = apps.filter(a => (active === "All" || a.category === active) &&
    (!t || (a.title + " " + a.description + " " + a.category).toLowerCase().includes(t)));
  $("grid").replaceChildren(...list.map(card));
  $("empty").style.display = list.length ? "none" : "block";
  if (!apps.length) $("empty").textContent = "No apps yet. Upload one to the apps folder.";
}
$("q").addEventListener("input", render);
render();
</script>
</body>
</html>
