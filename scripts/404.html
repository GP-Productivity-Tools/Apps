<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 20px;
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f7f7f5; color: #1c1d1f; }
  a { color: #0f766e; }
</style>
</head>
<body>
  <div>
    <h1>That page isn't here</h1>
    <p>The app may have moved or been renamed.</p>
    <p><a id="home" href="/">See all apps</a></p>
  </div>
  <script>
    // Project sites live under /<repo>/, so point "home" at the first path segment.
    var seg = location.pathname.split("/").filter(Boolean)[0];
    if (seg && location.hostname.endsWith("github.io")) document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
